name: BibleManna render cards
on:
  workflow_dispatch:
    inputs:
      style:
        description: 'black (Verse) or white (Quotes)'
        required: true
      list_text:
        description: 'Verse list text'
        required: true
      chat_id:
        description: 'Telegram chat to report back to'
        required: true
  repository_dispatch:
    types: [render-cards]
permissions:
  contents: read
concurrency:
  group: biblemanna-cards
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Locate or install Chrome
        run: |
          CHROME=$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser || true)
          if [ -z "$CHROME" ]; then
            wget -q -O /tmp/chrome.pub https://dl.google.com/linux/linux_signing_key.pub
            sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg /tmp/chrome.pub
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq && sudo apt-get install -y -qq google-chrome-stable
            CHROME=$(which google-chrome)
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Install deps
        run: npm init -y && npm install puppeteer-core
      - name: Prepare input
        env:
          LIST_TEXT: ${{ github.event.client_payload.list_text || github.event.inputs.list_text }}
          STYLE: ${{ github.event.client_payload.style || github.event.inputs.style }}
        run: |
          printf '%b' "$LIST_TEXT" > list.txt
          echo "STYLE=$STYLE" >> "$GITHUB_ENV"
      - name: Render cards
        run: |
          BG='#000000'; [ "$STYLE" = "white" ] && BG='#ffffff'
          node render.js list.txt "out-$STYLE" "$BG"
      - name: Callback with rendered cards
        if: ${{ env.CALLBACK_URL != '' }}
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}
        run: node upload_cards.js "out-$STYLE" "$STYLE" "$CHAT_ID"
