name: BibleManna Telegram music video
on:
  workflow_dispatch:
    inputs:
      job:
        description: 'JSON: {"chat_id": "...", "images": [telegram file ids], "audios": [telegram file ids]}'
        required: true
        type: string
  repository_dispatch:
    types: [render-videos]
permissions:
  contents: read
concurrency:
  group: biblemanna-video
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet pillow
      - name: Render and return private videos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ vars.ALLOWED_CHAT_IDS }}
          JOB_JSON: ${{ github.event.client_payload.job || github.event.inputs.job }}
        run: python3 render_tg.py
      - name: Callback with rendered videos
        if: success()
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          STYLE: ${{ fromJSON(github.event.client_payload.job || github.event.inputs.job).style || 'black' }}
          CHAT_ID: ${{ fromJSON(github.event.client_payload.job || github.event.inputs.job).chat_id }}
        run: node upload_videos.js out-videos "$STYLE" "$CHAT_ID"
